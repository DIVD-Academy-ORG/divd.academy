# Quality gates for divd.academy (issue #39).
#
# INSTALL: move this file to .github/workflows/quality-gates.yml in a commit by a
# maintainer. The DIVD-Academy GitHub App is not allowed to write to
# .github/workflows/, which is why it lives in docs/ci/ until then.
#
# What fails the build (exit 1):
#   check_site.py        dead internal links/assets, missing title/description/
#                        canonical/hreflang/og:image, media rules, invalid JSON-LD,
#                        pages missing from sitemap.xml
#   check_launch.py      html lang, exactly one <title> and <h1>, self-canonical,
#                        reciprocal hreflang pairs, language switch, redirect stubs
#                        (no chains, fallback link, noindex), sitemap/robots/404
#   generate_structured_data.py --check   breadcrumb JSON-LD out of date
#   generate_sitemap.py + git diff        sitemap.xml out of date
#   check_a11y.py        axe-core WCAG 2.x A/AA violations at 1280 and 320 px,
#                        structural checks and reflow
#
# External links are probed weekly (report only, never blocking): third-party
# sites fail intermittently; the allowlist lives in scripts/check_launch.py.
#
# Automated checks are not the only acceptance gate: see docs/accessibility-audit.md
# and docs/prelaunch-qa.md for what still needs a human.

name: quality-gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC: external link report
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Links, metadata, media, JSON-LD
        run: python3 scripts/check_site.py
      - name: Lang, H1, canonicals, hreflang, redirects, sitemap
        run: python3 scripts/check_launch.py
      - name: Structured data up to date
        run: python3 scripts/generate_structured_data.py --check
      - name: Sitemap up to date
        run: |
          python3 scripts/generate_sitemap.py
          git diff --exit-code -- sitemap.xml

  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: static
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Playwright (pinned)
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - name: axe-core + structural checks
        run: python3 scripts/check_a11y.py --json a11y-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: a11y-report
          path: a11y-report.json
          retention-days: 14

  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: External link report (non-blocking)
        run: python3 scripts/check_launch.py --external | tee -a "$GITHUB_STEP_SUMMARY"
