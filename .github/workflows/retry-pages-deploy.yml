name: Retry Pages deploy on transient failure

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt <= 2 }}
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs in managed Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            /repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs
