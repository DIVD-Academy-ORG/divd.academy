name: Site quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links, metadata and analytics
        run: python3 scripts/check_site.py
      - name: Sitemap is up to date
        run: |
          python3 scripts/generate_sitemap.py
          git diff --exit-code sitemap.xml
